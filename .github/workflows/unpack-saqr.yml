name: Unpack SAQR Voice website

on:
  push:
    branches:
      - saqr-voice-site
    paths:
      - '.saqr-package/**'
      - '.github/workflows/unpack-saqr.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.saqr-package/**'
      - '.github/workflows/unpack-saqr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out SAQR branch
        uses: actions/checkout@v4
        with:
          ref: saqr-voice-site
          fetch-depth: 0

      - name: Verify and unpack the website package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .saqr-package ]; then
            echo 'The package is already unpacked; nothing to do.'
            exit 0
          fi
          cat .saqr-package/part-* > /tmp/saqr-site.tar.gz.b64
          base64 --decode /tmp/saqr-site.tar.gz.b64 > /tmp/saqr-site.tar.gz
          echo '16e1891401c2c00f8ccd34364a468a911f069bd51f50c5132d0d5c8a87883beb  /tmp/saqr-site.tar.gz' | sha256sum --check --strict
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.saqr-package' \
            -exec rm -rf {} +
          tar -xzf /tmp/saqr-site.tar.gz -C .
          rm -rf .saqr-package

      - name: Commit the completed site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No website changes to commit.'
            exit 0
          fi
          git commit -m 'Build SAQR Voice bilingual website'
          git push origin HEAD:saqr-voice-site
